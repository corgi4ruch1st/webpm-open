<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebPM · ฝบอ.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234dc4b4' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b2138; font-family: "IBM Plex Sans Thai", "Sarabun", sans-serif; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #status {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center; color: #cadcfc; text-align: center; padding: 24px;
    background:
      radial-gradient(900px 520px at 15% -10%, #14335320 0%, transparent 55%),
      radial-gradient(700px 420px at 100% 0%, #0e938420 0%, transparent 52%),
      #0b2138;
  }
  #status.hidden { display: none; }
  #status a { color: #4dc4b4; }
  .mark {
    width: 56px; height: 56px; border-radius: 16px;
    display: grid; place-items: center;
    background: linear-gradient(140deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
    border: 1px solid rgba(255,255,255,.16);
  }
  .mark svg { width: 28px; height: 28px; color: #4dc4b4; }
  .title { font-size: 18px; font-weight: 600; color: #fff; letter-spacing: -.01em; }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,.15); border-top-color: #4dc4b4;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { font-size: 12.5px; color: #7d94ad; max-width: 380px; line-height: 1.6; }
</style>
</head>
<body>
  <div id="status">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/></svg>
    </div>
    <div class="title">WebPM</div>
    <div class="spinner"></div>
    <div class="hint">
      ถ้าค้างเกิน 10 วินาที หรือขึ้นหน้า "ไม่พบเพจ" ให้ล็อกอิน Google ในกรอบด้านล่าง
      แล้วรีเฟรชหน้านี้อีกครั้ง — หรือ
      <a href="https://script.google.com/macros/s/AKfycbxp15eoeA6V1-dNSztAWvWhQ4QIMbls4Fbe3tX0lhQeI0sQYyTNvoId5aBZSJreS2DC0A/exec" target="_blank" rel="noopener">เปิดลิงก์ตรงในแท็บใหม่</a>
    </div>
  </div>
  <iframe
    id="app"
    credentialless
    src="https://script.google.com/macros/s/AKfycbxp15eoeA6V1-dNSztAWvWhQ4QIMbls4Fbe3tX0lhQeI0sQYyTNvoId5aBZSJreS2DC0A/exec"
    title="WebPM"
    referrerpolicy="no-referrer"
  ></iframe>
  <script>
    // เอาข้อความ "กำลังโหลด" ออกทันทีที่ iframe เริ่มโหลดเนื้อหา
    // (โหลดสำเร็จหรือไม่ ผู้ใช้เห็นผลจริงในกรอบอยู่แล้ว ไม่ต้องเดาสถานะซ้ำ)
    document.getElementById("app").addEventListener("load", function () {
      document.getElementById("status").classList.add("hidden");
    });
  </script>
</body>
</html>
